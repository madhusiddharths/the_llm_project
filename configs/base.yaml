# 2026-09-22: re-pinned after review (nested argument notes, tool_format="json"
# ablation added to the golden). Retail prompts are byte-identical to before.
prompt_template_hash: "138c4b02d9694eef9e5a19723c413b3a698d8feb8e6de5816671bb58d2585a30"

# FROZEN 2026-09-21. The serializer hash that was live when the teacher harvest
# was recorded (2026-09-11 to 09-15). It feeds teacher_fingerprint() instead of
# the live hash above. tau2 built the teacher's prompts, not src/prompts.py, so
