name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # requirements-dev.txt, not requirements.txt: the core modules import no
      # torch (enforced by tests/test_core_is_light.py), so CI installs four
      # packages in seconds instead of ~1.7 GB of ML wheels.
      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: |
          ruff check src tests
          ruff format --check src tests

      - name: Type check
        run: pyright

      - name: Tests
        run: pytest

      # The smoke paths that need nothing outside the repo. harvest, train,
      # generate and eval_free smoke where their real job runs (the API,
      # Kaggle): they need litellm or a GPU, which this job does not install.
      # eval_forced's smoke replays the teacher trajectories, which are
      # gitignored (108 MB), so it runs locally in `make smoke`; its logic is
      # covered by tests/test_eval_forced.py here.
      - name: Smoke paths
        run: make smoke PY=python SCRIPTS="router_node taxonomy"
